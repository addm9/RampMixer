name: Demo tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r code/requirements.txt
      - name: Unit tests
        run: python code/run_tests.py
      - name: End-to-end example
        run: |
          python code/train.py --epochs 1 --output outputs/ci
          python code/verify_run.py --run outputs/ci
